<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Delivery | RIC — Rest In Coffee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>

    <!-- NAVBAR DELIVERY -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom" style="background-color: rgba(248, 245, 240, 0.95);">
        <div class="container">
            <a class="navbar-brand font-serif d-flex align-items-center gap-2" href="delivery.html">
                <span class="fs-3 fw-bold">RIC</span>
                <span class="badge rounded-pill" style="background-color: var(--accent-coffee);">Delivery</span>
            </a>

            <div class="d-flex align-items-center gap-2 ms-auto">
                <div id="authNavContainer"></div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO DELIVERY -->
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="font-serif fw-bold mb-1">Entregas a Domicilio</h1>
                <p class="text-muted small mb-0">Pedidos terminados en barra listos para llevar al cliente.</p>
            </div>
            <div>
                <span class="badge bg-dark rounded-pill px-3 py-2 fs-6">
                    Entregas activas: <strong id="countDeliveries">0</strong>
                </span>
            </div>
        </div>

        <!-- TARJETAS DE ENTREGAS -->
        <div id="deliveryOrdersGrid" class="row g-4">
            <!-- Se llena desde js/delivery.js -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/delivery.js"></script>
</body>
</html>
