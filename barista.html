<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra Barista | RIC — Rest In Coffee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>

    <!-- NAVBAR BARISTA -->
    <nav class="navbar navbar-expand-lg sticky-top border-bottom" style="background-color: rgba(248, 245, 240, 0.95);">
        <div class="container">
            <a class="navbar-brand font-serif d-flex align-items-center gap-2" href="barista.html">
                <span class="fs-3 fw-bold">RIC</span>
                <span class="badge rounded-pill" style="background-color: var(--accent-coffee);">Barra Barista</span>
            </a>

            <div class="d-flex align-items-center gap-2 ms-auto">
                <div id="authNavContainer"></div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO BARISTA -->
    <main class="container py-5">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h1 class="font-serif fw-bold mb-1">Comandas en Barra</h1>
                <p class="text-muted small mb-0">Prepara las bebidas según las especificaciones y envíalas a Delivery.</p>
            </div>
            <div class="d-flex gap-3">
                <span class="badge bg-warning text-dark rounded-pill px-3 py-2 fs-6">
                    Pendientes: <strong id="countPending">0</strong>
                </span>
                <span class="badge bg-info text-dark rounded-pill px-3 py-2 fs-6">
                    En preparación: <strong id="countPreparing">0</strong>
                </span>
            </div>
        </div>

        <!-- TARJETAS DE COMANDAS -->
        <div id="baristaOrdersGrid" class="row g-4">
            <!-- Se llena desde js/barista.js -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/barista.js"></script>
</body>
</html>
